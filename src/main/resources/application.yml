spring:
  datasource:
    url: jdbc:h2:mem:jiralite;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true

app:
  jwt:
    secret: "your-256-bit-secret-key-here-make-it-long-enough-for-hs256-algorithm"
    expiration-ms: 86400000

server:
  port: 8080
