spring:
  datasource:
    url: jdbc:h2:mem:jiralite;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

jiralite:
  jwt:
    secret: change-me-change-me-change-me-change-me-change-me-change-me
    expiration-minutes: 120

logging:
  level:
    org.hibernate.SQL: WARN
